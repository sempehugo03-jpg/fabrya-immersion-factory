<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>FABRYA - Horlogerie Immersive</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #f0f0f0;
            --accent-gold: #d4af37;
            --accent-stainless: #bdc3c7;
            --font-family: 'Courier New', Courier, monospace; /* Typographie technique/horlogère */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Canvas Layer */
        canvas#fabrya-stage {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            filter: contrast(1.2) brightness(1.1);
        }

        /* UI Overlay */
        #ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas if needed, but we use buttons below */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(5,5,5,0), var(--bg-color));
            height: 100%;
        }

        .brand-logo {
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 5px;
        }

        .controls-container {
            pointer-events: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            width: 60%;
            max-width: 800px;
        }

        /* Custom Scrollbar for dropdowns */
        select {
            appearance: none;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 10px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .status-line {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            right: 2rem;
            z-index: 9;
            text-align: center;
            opacity: 0.6;
            font-size: 0.8rem;
            color: #aaa;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- The Canvas where the media lives -->
    <canvas id="fabrya-stage"></canvas>

    <!-- UI Interface -->
    <div id="ui-layer">
        <div class="brand-logo">FABRYA // HORLOGERIE</div>
        
        <div class="controls-container">
            <select id="ctrl-clockType" title="Type de Montre">
                <option value="quartz">Quartz (Précision)</option>
                <option value="mechanique">Mécanique (Artisanat)</option>
            </select>

            <select id="ctrl-material" title="Matériau du Boîtier">
                <option value="acier">Acier Inoxydable</option>
                <option value="or">Or 18k</option>
            </select>

            <select id="ctrl-bracelet" title="Bracelet">
                <option value="non">Sans Bracelet</option>
                <option value="acier">Bracelet Acier</option>
                <option value="or">Bracelet Or</option>
            </select>

            <select id="ctrl-color" title="Couleur Diale">
                <option value="noir">Noir Profond</option>
                <option value="blanc">Blanc Ébène</option>
                <option value="rouge">Rouge Sang</option>
            </select>
        </div>
    </div>

    <div class="status-line" id="fabrya-status">INITIALISATION DU SYSTÈME...</div>

    <!-- FABRYA MEDIA PROTOCOL -->
    <script id="fabrya-media-protocol" type="application/json">
    {
      "controls": [
        {
          "key": "clockType",
          "label": "TYPE DE MONTRE",
          "choices": [
            {"value": "quartz", "label": "QUARTZ (PRÉCISION)"},
            {"value": "mechanique", "label": "MÉCANIQUE (ARTISANAL)"}
          ]
        },
        {
          "key": "material",
          "label": "MATÉRIAU BOÎTIER",
          "choices": [
            {"value": "acier", "label": "ACIER INOXYDABLE"},
            {"value": "or", "label": "OR 18K"}
          ]
        },
        {
          "key": "bracelet",
          "label": "BRACELET",
          "choices": [
            {"value": "non", "label": "SANS BRACELET"},
            {"value": "acier", "label": "BRACELET ACIER"},
            {"value": "or", "label": "BRACELET OR"}
          ]
        },
        {
          "key": "color",
          "label": "COULEUR DIAL",
          "choices": [
            {"value": "noir", "label": "NOIR PROFOND"},
            {"value": "blanc", "label": "BLANC ÉBÈNE"},
            {"value": "rouge", "label": "ROUGE SANG"}
          ]
        }
      ]
    }
    </script>

</body>
</html>
