name: FABRYA carte blanche horloger
on:
  push:
    branches:
      - experiment/carte-blanche-horloger
    paths:
      - .github/workflows/fabrya-carte-blanche-horloger.yml
permissions:
  contents: read
jobs:
  local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Run the original creative pipeline and model-authored production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf '%s' 'Tu es un horloger et tu dois me créer un putain de site immersif.' > run/brief.txt
          curl -fL --retry 2 -o "$RUNNER_TEMP/llama.tar.gz" https://github.com/ggml-org/llama.cpp/releases/download/b12532/llama-b12532-bin-ubuntu-x64.tar.gz
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP"
          curl -fL --retry 2 -o "$RUNNER_TEMP/model.gguf" https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          npm install --no-save playwright@1.58.0
          server=$(find "$RUNNER_TEMP" -name llama-server -type f -print -quit)
          "$server" -m "$RUNNER_TEMP/model.gguf" --alias fabrya-qwen25-7b --host 127.0.0.1 --port 18222 -c 12288 -t 4 -tb 4 -np 1 --no-warmup > run/llama.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18222/health >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/explore-local-json.py explore run/brief.txt --out run/exploration --local-url http://127.0.0.1:18222 --local-model fabrya-qwen25-7b --production-cap-microusd 0
          python3 scripts/realize-exploration.py --exploration run/exploration --brief run/brief.txt --evidence run/production --site run/website/index.html --port 18222 --model fabrya-qwen25-7b
          export FABRYA_BROWSER_PATH
          FABRYA_BROWSER_PATH=$(command -v google-chrome)
          node scripts/inspect-exploration-browser.cjs run/website/index.html run/browser-initial
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          target = Path("run/browser-initial/observations.json")
          evidence = json.loads(target.read_text())
          for result in evidence.values():
              for state in [result["opening"], *result["steps"].values()]:
                  state.pop("headings", None)
                  state["visibleText"] = state["visibleText"][:7]
                  state["controls"] = [item for item in state["controls"] if item["tag"] in {"button", "input", "select"}]
          Path("run/browser-review-input.json").write_text(json.dumps(evidence, ensure_ascii=False))
          PYTHON
          cp run/website/index.html run/production/premier-rendu.html
          if python3 scripts/realize-exploration.py --exploration run/exploration --brief run/brief.txt --evidence run/production --site run/website/index.html --port 18222 --model fabrya-qwen25-7b --review run/browser-review-input.json; then
            printf '%s\n' applied > run/production/review-status.txt
          else
            printf '%s\n' failed > run/production/review-status.txt
          fi
          if cmp -s run/production/premier-rendu.html run/website/index.html; then
            mv run/browser-initial run/browser-final
          else
            node scripts/inspect-exploration-browser.cjs run/website/index.html run/browser-final
            rm -rf run/browser-initial/*-frames
          fi
          for viewport in ordinateur mobile; do
            ffmpeg -v error -f concat -safe 0 -i "run/browser-final/${viewport}-frames/concat.txt" -vf 'scale=1440:900:force_original_aspect_ratio=decrease,pad=1440:900:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30' -an -pix_fmt yuv420p -c:v libx264 -preset fast -movflags +faststart "run/browser-final/${viewport}.mp4"
            rm -rf "run/browser-final/${viewport}-frames"
          done
          printf 'file ordinateur.mp4\nfile mobile.mp4\n' > run/browser-final/video-list.txt
          ffmpeg -v error -f concat -safe 0 -i run/browser-final/video-list.txt -c copy -movflags +faststart run/browser-final/demonstration.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabrya-horloger
          path: run/
          retention-days: 1
