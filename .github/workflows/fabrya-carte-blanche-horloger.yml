name: FABRYA horloger — correction de la réalisation
on:
  push:
    branches:
      - experiment/horloger-reprise-verifiee
    paths:
      - .github/workflows/fabrya-carte-blanche-horloger.yml
permissions:
  contents: read
  actions: read
jobs:
  local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve the original browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44567419522 --name fabrya-horloger --dir "$RUNNER_TEMP/horloger-checkpoint"
      - name: Repair and verify the model-authored site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/llama.tar.gz" https://github.com/ggml-org/llama.cpp/releases/download/b12532/llama-b12532-bin-ubuntu-x64.tar.gz
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP"
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/model.gguf" https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/ae44f08e1392f39c0e474af10c3ff8355c8b6688/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          sha256sum "$RUNNER_TEMP/model.gguf" > run/model-sha256.txt
          npm install --no-save playwright@1.58.0
          server=$(find "$RUNNER_TEMP" -name llama-server -type f -print -quit)
          "$server" -m "$RUNNER_TEMP/model.gguf" --alias fabrya-qwen3-4b --host 127.0.0.1 --port 18222 -c 10500 -t 4 -np 1 --no-warmup > run/llama.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18222/health >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/repair-horloger-capture.py "$RUNNER_TEMP/horloger-checkpoint" run --model fabrya-qwen3-4b
          npx playwright install ffmpeg
          FABRYA_BROWSER_PATH="$(command -v google-chrome)" node scripts/inspect-exploration-browser.cjs run/website/index.html run/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabrya-horloger-reparation
          path: run/
          retention-days: 1
