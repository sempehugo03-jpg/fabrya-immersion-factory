name: FABRYA carte blanche horloger
on:
  push:
    branches:
      - experiment/carte-blanche-horloger
    paths:
      - .github/workflows/fabrya-carte-blanche-horloger.yml
permissions:
  contents: read
jobs:
  local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the original creative pipeline and model-authored production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf '%s' 'Tu es un horloger et tu dois me créer un putain de site immersif.' > run/brief.txt
          curl -fL --retry 2 -o "$RUNNER_TEMP/llama.tar.gz" https://github.com/ggml-org/llama.cpp/releases/download/b12532/llama-b12532-bin-ubuntu-x64.tar.gz
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP"
          curl -fL --retry 2 -o "$RUNNER_TEMP/model.gguf" https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          server=$(find "$RUNNER_TEMP" -name llama-server -type f -print -quit)
          "$server" -m "$RUNNER_TEMP/model.gguf" --alias fabrya-qwen25-7b --host 127.0.0.1 --port 18222 -c 12288 -t 4 -tb 4 -np 1 --no-warmup > run/llama.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18222/health >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/explore-local-json.py explore run/brief.txt --out run/exploration --local-url http://127.0.0.1:18222 --local-model fabrya-qwen25-7b --production-cap-microusd 0
          python3 scripts/realize-exploration.py --exploration run/exploration --brief run/brief.txt --evidence run/production --site run/website/index.html --port 18222 --model fabrya-qwen25-7b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabrya-horloger
          path: run/
          retention-days: 1
