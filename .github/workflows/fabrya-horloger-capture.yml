name: FABRYA horloger — preuve navigateur
on:
  push:
    branches:
      - experiment/horloger-reprise-verifiee
    paths:
      - experiments/carte-blanche-horloger/index.html
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record desktop and mobile interaction
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.58.0
          npx playwright install ffmpeg
          FABRYA_BROWSER_PATH="$(command -v google-chrome)" node scripts/inspect-exploration-browser.cjs experiments/carte-blanche-horloger/index.html evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horloger-proof
          path: evidence/
          retention-days: 1
